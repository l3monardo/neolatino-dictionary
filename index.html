  <script>
    // light / dark before the first paint: the saved choice, else the system's
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("nl-theme"); } catch (e) { /* storage blocked */ }
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <!-- ?v=…: change it whenever you upload new files, so browsers and the CDN load them at once -->
  <link rel="stylesheet" href="styles.css?v=20261023b">
